name: Release & Doku

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh android
      - run: flutter pub get
      - run: flutter test
      # Signiert wird vorerst mit dem Debug-Schlüssel – reicht zum
      # Installieren, aber nicht für den Play Store.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk prog_trainer.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: prog_trainer.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh ios
      - run: flutter pub get
      # Unsigniert: muss vor der Installation signiert werden
      # (z. B. mit AltStore/Sideloadly und einer kostenlosen Apple-ID).
      - run: flutter build ios --release --no-codesign
      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr prog_trainer-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: ios
          path: prog_trainer-unsigned.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/prog_trainer.apk dist/prog_trainer-unsigned.ipa \
            --title "Aktueller Build" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Android: APK installieren. iOS: IPA mit AltStore oder Sideloadly signieren." \
            --target "$GITHUB_SHA" \
            --prerelease

  docs:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict -d site
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      # C#-Laufzeit (Roslyn + .NET als WebAssembly) für die App
      - run: dotnet publish csharp_runtime -c Release -o csharp_runtime/out
      - run: cp -r csharp_runtime/out/wwwroot site/csharp
      - uses: actions/download-artifact@v5
        with:
          path: site/download
          merge-multiple: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
