name: Release & Doku

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=android --project-name prog_trainer .

      - run: flutter pub get
      - run: flutter test

      # Release-Build. Signiert wird vorerst mit dem Debug-Schlüssel –
      # reicht zum Installieren, aber nicht für den Play Store.
      - run: flutter build apk --release

      - name: APK umbenennen
        run: cp build/app/outputs/flutter-apk/app-release.apk prog_trainer.apk

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest prog_trainer.apk \
            --title "Aktueller Build" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --prerelease

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: prog_trainer.apk

  docs:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict -d site

      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: site/download

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
