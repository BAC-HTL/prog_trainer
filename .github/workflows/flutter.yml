name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  content:
    name: Lösungen & Missionen prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: python3 tool/verify_challenges.py python
      - run: python3 tool/verify_challenges.py csharp
      - run: python3 tool/verify_missions.py

  csharp-runtime:
    name: C#-Laufzeit (WebAssembly) im Browser testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Laufzeit bauen und packen (wie auf Pages)
        run: bash tool/package_csharp_runtime.sh /tmp/csharp
      - name: Playwright installieren
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Im Browser testen
        run: |
          python3 -m http.server 8000 --directory /tmp/csharp &
          sleep 2
          node tool/test_csharp_runtime.mjs http://localhost:8000/
      - name: Web-Runner (Python + C#) im Browser testen
        run: |
          mkdir -p /tmp/site/prog_trainer/app
          cp -r /tmp/csharp /tmp/site/prog_trainer/csharp
          cp web/runners.js /tmp/site/prog_trainer/app/
          printf '<!doctype html><html><head><base href="/prog_trainer/app/"><script src="runners.js"></script></head><body></body></html>' > /tmp/site/prog_trainer/app/index.html
          python3 -m http.server 8001 --directory /tmp/site &
          sleep 2
          node tool/test_web_runners.mjs http://localhost:8001/prog_trainer/app/

  android:
    name: Tests + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh android
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - name: Web-Version bauen
        run: |
          bash tool/prepare_platforms.sh web
          flutter build web --release --base-href /prog_trainer/app/
      - uses: actions/upload-artifact@v5
        with:
          name: prog_trainer-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: iOS-Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/prepare_platforms.sh ios
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign
