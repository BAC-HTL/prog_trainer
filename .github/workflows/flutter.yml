name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Erzeugt den android/-Ordner, solange er noch nicht im Repo liegt.
      # Vorhandene Dateien werden dabei nicht überschrieben.
      - name: Plattform-Ordner erzeugen
        run: flutter create --platforms=android --project-name prog_trainer .

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: prog_trainer-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
