name: prog_trainer
description: Lern-App zum Programmierenlernen – von null bis Senior-Level.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  pdf: ^3.11.0
  printing: ^5.13.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  # Jeder Inhaltsordner muss hier einzeln eingetragen werden.
  assets:
    - assets/content/
    - assets/content/python/
    - assets/content/python/einsteiger/
    - assets/content/python/fortgeschritten/
    - assets/content/csharp/
    - assets/content/csharp/einsteiger/
    - assets/content/csharp/fortgeschritten/
    - assets/content/pos/j1/python/
    - assets/content/pos/j1/csharp/
    - assets/content/pos/j2/python/
    - assets/content/pos/j2/csharp/
    - assets/content/pos/j2/theorie/
    - assets/content/dbi/j1/
    - assets/content/dbi/j2/
    - assets/content/nvs/j2/
    - assets/content/tinf/j1/
    - assets/content/tinf/j2/
    - assets/game/
    - assets/icon/logo_mark.png
