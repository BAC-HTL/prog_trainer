name: prog_trainer
description: Lern-App zum Programmierenlernen – von null bis zu Software-Architektur.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Jeder Inhaltsordner muss hier einzeln eingetragen werden.
  assets:
    - assets/content/
    - assets/content/python/
    - assets/content/csharp/
